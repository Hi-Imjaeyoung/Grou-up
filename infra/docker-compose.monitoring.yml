# Prometheus :9090, Grafana :${GRAFANA_HOST_PORT:-3001}
# 컨테이너 이름은 다른 프로젝트의 prometheus/grafana 와 겹치지 않도록 grouup- 접두어를 붙인다.
services:
  prometheus:
    image: prom/prometheus
    container_name: grouup-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
  grafana:
    image: grafana/grafana
    container_name: grouup-grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: always
    depends_on:
      - prometheus
